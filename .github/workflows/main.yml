name: Build Godot No-SSE4.2
on: [workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Скачивает только последний коммит (экономия места)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      - name: Build Editor (x86_64-v1 / SSE2)
        run: scons platform=windows target=editor arch=x86_64 optimize=speed ccflags="-march=x86-64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-sse2
          path: bin/godot.windows.editor.x86_64.exe
