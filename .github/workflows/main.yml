name: Build Godot Windows x64 (SSE2 / No-SSE4.2)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на вкладке Actions

jobs:
  build-windows-sse2:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Godot Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons and Zstandard
        run: |
          python -m pip install --upgrade pip
          pip install scons zstandard

      - name: Install Windows Dependencies (D3D12, AccessKit, ANGLE)
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py
          python misc/scripts/install_accesskit.py
          python misc/scripts/install_angle.py

      - name: Build Godot Editor (x86_64 SSE2)
        run: scons platform=windows target=editor arch=x86_64 optimize=speed lto=none -j4

      - name: Build Windows Export Template Release (x86_64 SSE2)
        run: scons platform=windows target=template_release arch=x86_64 optimize=speed lto=none -j4

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Windows-x64-SSE2
          path: |
            bin/godot.windows.editor.x86_64.exe
            bin/godot.windows.template_release.x86_64.exe
          compression-level: 9
